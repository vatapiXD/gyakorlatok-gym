<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    
    <link rel="stylesheet" href="src/style.css" />
</head>

<body>
   <header> <h1>Testtömeg index számláló</h1> <button id="darkModeToggle">🌙 Sötét mód</button></header>
    <nav>
        <a href="index.html">Rólunk</a>
        <a href="gyak.html">Gyakorlatok</a>
        <a href="kaja.html">Kalóriabázis</a>
        <a href="cal.html">Kalóriaszükséglet</a>
        <a href="bmi.html">BMI</a>
        <a href="videok.html">Segítő videók</a>
        
    </nav>

    <div class="container">

        <p>Magasság (cm-ben megadva)</p>

        <input type="text" id="height" />

        <p>Testsúly (kg-ban megadva)</p>

        <input type="text" id="weight" />

        <button id="btn">BMI számítása</button>

        <div id="result"></div>
    </div>

    <img src="https://static.vecteezy.com/system/resources/previews/005/905/467/non_2x/bmi-classification-chart-measurement-man-set-male-body-mass-index-infographic-with-weight-status-from-underweight-to-severely-obese-medical-body-mass-control-graph-eps-illustration-vector.jpg" alt="">

    <script>
  const toggleButton = document.getElementById('darkModeToggle');

  toggleButton.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');

    // Gomb ikon és szöveg frissítése
    if (document.body.classList.contains('dark-mode')) {
      toggleButton.innerText = '☀️ Világos mód';
    } else {
      toggleButton.innerText = '🌙 Sötét mód';
    }
  });

  // BMI kalkulátor
  const btn = document.getElementById('btn');
  const resultDiv = document.getElementById('result');

  btn.addEventListener('click', () => {
    const height = parseFloat(document.getElementById('height').value);
    const weight = parseFloat(document.getElementById('weight').value);

    if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
      resultDiv.innerHTML = '<span style="color:red;">Kérlek, adj meg érvényes adatokat!</span>';
      return;
    }

    const heightM = height / 100;
    const bmi = weight / (heightM * heightM);
    let category = '';

    if (bmi < 18.5) {
      category = 'Sovány';
    } else if (bmi < 25) {
      category = 'Normál testsúly';
    } else if (bmi < 30) {
      category = 'Túlsúlyos';
    } else {
      category = 'Elhízott';
    }

    resultDiv.innerHTML = `A BMI-d: <b>${bmi.toFixed(1)}</b> (${category})`;
  });
</script>
</body>

</html>
